<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ISAC animation: a base station keeps a data link to a user, switches sensing on when a car is about to block the link, and recovers after it passes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1e33"/>
      <stop offset="1" stop-color="#0c2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f3350" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <!-- sensing wedge: from the antenna toward the road -->
    <clipPath id="senseWedge"><polygon points="182,168 650,-30 650,340"/></clipPath>
    <!-- hides everything past the car while the link is blocked -->
    <mask id="blockMask">
      <rect width="1200" height="300" fill="#fff"/>
      <rect x="560" width="640" height="300" fill="#000" fill-opacity="0">
        <animate attributeName="fill-opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>
  <style>
    .meta  { font: 500 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b9bb0; letter-spacing: 1.5px; }
    .title { font: 600 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
    .lbl   { font: 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b9bb0; letter-spacing: 1.5px; }
    .val   { font: 700 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.5px; }
    .cap   { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #6b7c93; letter-spacing: 0.5px; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/>

    <!-- road -->
    <rect x="560" width="80" height="300" fill="#0d1828"/>
    <line x1="560" y1="0" x2="560" y2="300" stroke="#24364f" stroke-width="2"/>
    <line x1="640" y1="0" x2="640" y2="300" stroke="#24364f" stroke-width="2"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#3b5272" stroke-width="2" stroke-dasharray="14 12"/>

    <!-- communication beam and link -->
    <polygon points="184,172 1016,158 1016,202 184,188" fill="url(#beam)"/>
    <line x1="196" y1="180" x2="560" y2="180" stroke="url(#accent)" stroke-width="2.5" opacity="0.8"/>
    <g mask="url(#blockMask)">
      <line x1="560" y1="180" x2="1016" y2="180" stroke="#60a5fa" stroke-width="2.5" opacity="0.8"/>
    </g>
    <line x1="640" y1="180" x2="1016" y2="180" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 8" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.45;0.47;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
    </line>

    <!-- data packets -->
    <g mask="url(#blockMask)" fill="#e6edf3">
      <circle r="3.5"><animateMotion path="M196 180 H1016" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion path="M196 180 H1016" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion path="M196 180 H1016" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion path="M196 180 H1016" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animateMotion path="M196 180 H1016" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sensing pulses (only while sensing is active) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.76;0.78;1" dur="9s" repeatCount="indefinite"/>
      <g clip-path="url(#senseWedge)" fill="none" stroke="#2dd4bf" stroke-width="2">
        <circle cx="182" cy="168" r="20"><animate attributeName="r" values="20;480" dur="1.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="182" cy="168" r="20"><animate attributeName="r" values="20;480" dur="1.6s" begin="0.53s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="0.53s" repeatCount="indefinite"/></circle>
        <circle cx="182" cy="168" r="20"><animate attributeName="r" values="20;480" dur="1.6s" begin="1.07s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="1.07s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- the car (blocker), its echoes and the tracking box -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -60;0 320" dur="9s" repeatCount="indefinite"/>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.76;0.78;1" dur="9s" repeatCount="indefinite"/>
        <g fill="none" stroke="#fbbf24" stroke-width="1.5">
          <circle cx="600" cy="32" r="8"><animate attributeName="r" values="8;70" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
          <circle cx="600" cy="32" r="8"><animate attributeName="r" values="8;70" dur="1.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
        </g>
        <rect x="570" y="-8" width="60" height="80" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 5"/>
      </g>
      <rect x="580" y="0" width="40" height="64" rx="10" fill="#1e3a5f" stroke="#93a8c4" stroke-width="1.5"/>
      <rect x="585" y="40" width="30" height="13" rx="4" fill="#0b1220" opacity="0.8"/>
      <rect x="585" y="12" width="30" height="9" rx="3" fill="#0b1220" opacity="0.6"/>
      <circle cx="586" cy="61" r="2.2" fill="#fef9c3"/>
      <circle cx="614" cy="61" r="2.2" fill="#fef9c3"/>
    </g>

    <!-- base station -->
    <g>
      <circle cx="170" cy="168" r="30" fill="url(#glow)" opacity="0.45"/>
      <path d="M170 196 L148 262 M170 196 L192 262 M156 238 H184 M162 218 H178" stroke="#93a8c4" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <rect x="158" y="144" width="24" height="52" rx="4" fill="#13263d" stroke="#60a5fa" stroke-width="1.5"/>
      <g fill="#2dd4bf">
        <circle cx="165" cy="154" r="2"/><circle cx="175" cy="154" r="2"/>
        <circle cx="165" cy="166" r="2"/><circle cx="175" cy="166" r="2"/>
        <circle cx="165" cy="178" r="2"/><circle cx="175" cy="178" r="2"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <text class="lbl" x="170" y="284" text-anchor="middle">BASE STATION</text>
    </g>

    <!-- user equipment -->
    <g>
      <rect x="1022" y="150" width="36" height="62" rx="7" fill="#13263d" stroke="#e6edf3" stroke-width="1.5"/>
      <rect x="1027" y="157" width="26" height="44" rx="3" fill="#2dd4bf" opacity="0.35">
        <animate attributeName="fill" values="#2dd4bf;#2dd4bf;#f87171;#f87171;#2dd4bf;#2dd4bf" keyTimes="0;0.45;0.47;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <g fill="#2dd4bf">
        <rect x="1070" y="198" width="5" height="8" rx="1"/>
        <rect x="1078" y="192" width="5" height="14" rx="1">
          <animate attributeName="opacity" values="1;1;0.2;0.2;1;1" keyTimes="0;0.45;0.47;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <rect x="1086" y="186" width="5" height="20" rx="1">
          <animate attributeName="opacity" values="1;1;0.2;0.2;1;1" keyTimes="0;0.45;0.47;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <rect x="1094" y="180" width="5" height="26" rx="1">
          <animate attributeName="opacity" values="1;1;0.2;0.2;1;1" keyTimes="0;0.45;0.47;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text class="lbl" x="1040" y="240" text-anchor="middle">USER</text>
    </g>

    <!-- title -->
    <text class="meta" x="40" y="46">ISAC · INTEGRATED SENSING &amp; COMMUNICATION</text>
    <text class="title" x="40" y="78">Sense only when a blockage is likely</text>

    <!-- status panel -->
    <g transform="translate(790 22)">
      <rect width="370" height="96" rx="12" fill="#0b1220" opacity="0.75" stroke="#1f3350"/>

      <text class="lbl" x="20" y="28">LINK</text>
      <circle cx="140" cy="24" r="5" fill="#2dd4bf">
        <animate attributeName="fill" values="#2dd4bf;#2dd4bf;#f87171;#f87171;#2dd4bf;#2dd4bf" keyTimes="0;0.45;0.47;0.62;0.64;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text class="val" x="154" y="28" fill="#2dd4bf">CLEAR
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.45;0.46;0.63;0.64;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="val" x="154" y="28" fill="#f87171" opacity="0">BLOCKED
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.46;0.63;0.64;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <text class="lbl" x="20" y="52">SENSING</text>
      <circle cx="140" cy="48" r="5" fill="#3b5272">
        <animate attributeName="fill" values="#3b5272;#3b5272;#fbbf24;#fbbf24;#3b5272;#3b5272" keyTimes="0;0.27;0.29;0.76;0.78;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text class="val" x="154" y="52" fill="#6b7c93">IDLE
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.27;0.28;0.77;0.78;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="val" x="154" y="52" fill="#fbbf24" opacity="0">ACTIVE
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.28;0.77;0.78;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <text class="lbl" x="20" y="78">P(BLOCKAGE)</text>
      <rect x="140" y="69" width="200" height="10" rx="5" fill="#1f3350"/>
      <rect x="140" y="69" width="16" height="10" rx="5" fill="url(#accent)">
        <animate attributeName="width" values="16;20;80;160;190;190;76;20;16" keyTimes="0;0.15;0.28;0.40;0.46;0.63;0.72;0.80;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <!-- sensing threshold -->
      <line x1="220" y1="64" x2="220" y2="84" stroke="#fbbf24" stroke-width="1.5"/>
    </g>

    <!-- caption -->
    <text class="cap" x="1160" y="284" text-anchor="end">Bayesian blockage detection (GDBN / MJPF) · sensing activation · incremental relearning</text>
  </g>
</svg>
